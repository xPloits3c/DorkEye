# =============================================================================
# wp-advanced.yaml — Template DorkEye per analisi di exposure avanzata.
#
# Uso (generatore nativo DorkEye):
#   python3 dorkeye.py --dg=<template> --mode=<soft|medium|aggressive> \
#                      -o Dump/report.json --stealth
#   es: python3 dorkeye.py --dg=wp_core --mode=medium -o Dump/wp.json --stealth
#
# Filosofia: tutto scopato su {domain} -> resta sul TUO asset.
# Le modalita' riflettono il rischio: discovery=soft, segreti/backup=medium,
# parametri iniettabili=aggressive. Usa SOLO su domini tuoi o autorizzati.
# =============================================================================

variables:

  # Il tuo dominio (senza http://). site:{domain} copre anche i sottodomini.
  domain:
    - example.com   # sostituisci con il tuo dominio


  # Parametri GET comuni (user-controllabili -> candidati a iniezione/leak).
  param:
    - id
    - page
    - file
    - path
    - dir
    - cat
    - search
    - q
    - url
    - redirect
    - return
    - next
    - lang
    - download
    - doc
    - cv
    - secret
    - data
    - token
    - key
    - user
    - email
    - debug

  # Documenti che spesso contengono PII o dati interni.
  extension:
    - pdf
    - doc
    - docx
    - xls
    - xlsx
    - csv
    - txt
    - rtf
    - odt
    - ppt
    - pptx

  # Estensioni di backup/archivio: ad alto rischio se indicizzate.
  backup_ext:
    - bak
    - old
    - orig
    - save
    - swp
    - tmp
    - zip
    - tar
    - tgz
    - gz
    - rar
    - 7z
    - sql
    - sql.gz
    - dump

  # File di configurazione / log.
  config_ext:
    - env
    - ini
    - conf
    - config
    - cfg
    - yml
    - yaml
    - json
    - xml
    - log

  # Percorsi sensibili (WordPress + web generico).
  path:
    - wp-content
    - wp-content/uploads
    - wp-content/debug.log
    - wp-content/backup-db
    - wp-includes
    - wp-admin
    - wp-json/wp/v2/users
    - xmlrpc.php
    - wp-login.php
    - wp-config
    - wp-content/uploads/backup
    - .git
    - .svn
    - .env
    - .well-known
    - backup
    - backups
    - old
    - temp
    - admin
    - phpmyadmin
    - server-status
    - server-info
    - cgi-bin

  # Nomi file ad alta sensibilita'.
  file:
    - wp-config.php
    - wp-config.php.bak
    - wp-config.php.old
    - wp-config.php.save
    - wp-config.txt
    - configuration.php
    - settings.php
    - config.php
    - .env
    - .env.local
    - .env.backup
    - .htaccess
    - .htpasswd
    - .git/config
    - id_rsa
    - credentials
    - secrets.json
    - backup.sql
    - dump.sql
    - database.sql
    - db.sql
    - error_log
    - debug.log
    - access.log
    - phpinfo.php
    - info.php
    - adminer.php
    - readme.html
    - license.txt
    - changelog.txt


templates:

  # --------------------------------------------------------------------------
  # DISCOVERY — superficie generale, basso rumore (soft)
  # --------------------------------------------------------------------------
  surface:
    mode: soft
    dorks:
      - 'site:{domain}'
      - 'site:{domain} inurl:{param}'
      - 'site:{domain} inurl:{path}'

  documents:
    mode: soft
    dorks:
      - 'site:{domain} filetype:{extension}'
      - 'site:{domain} inurl:uploads filetype:{extension}'

  directories:
    mode: soft
    dorks:
      - 'site:{domain} intitle:"index of"'
      - 'site:{domain} "parent directory"'
      - 'site:{domain} intitle:"index of" {path}'

  # --------------------------------------------------------------------------
  # WORDPRESS — specifico CMS (soft/medium)
  # --------------------------------------------------------------------------
  wp_core:
    mode: medium
    dorks:
      - 'site:{domain} inurl:wp-content'
      - 'site:{domain} inurl:wp-includes'
      - 'site:{domain} inurl:wp-json/wp/v2/users'
      - 'site:{domain} inurl:xmlrpc.php'
      - 'site:{domain} inurl:wp-login.php'
      - 'site:{domain} intitle:"index of" "wp-content"'

  wp_uploads:
    mode: medium
    dorks:
      - 'site:{domain} inurl:wp-content/uploads filetype:{extension}'
      - 'site:{domain} inurl:wp-content/uploads filetype:{backup_ext}'
      - 'site:{domain} intitle:"index of" "wp-content/uploads"'

  wp_debug:
    mode: medium
    dorks:
      - 'site:{domain} inurl:wp-content/debug.log'
      - 'site:{domain} filetype:log inurl:wp-content'

  # --------------------------------------------------------------------------
  # CONFIG & SEGRETI — exposure ad alto impatto (medium)
  # --------------------------------------------------------------------------
  config_files:
    mode: medium
    dorks:
      - 'site:{domain} filetype:{config_ext}'
      - 'site:{domain} inurl:{file}'
      - 'site:{domain} filetype:env'
      - 'site:{domain} ext:ini "wp-config"'

  secrets:
    mode: medium
    dorks:
      - 'site:{domain} inurl:.env'
      - 'site:{domain} inurl:.git'
      - 'site:{domain} inurl:.git/config'
      - 'site:{domain} inurl:.htpasswd'
      - 'site:{domain} "BEGIN RSA PRIVATE KEY"'
      - 'site:{domain} "api_key" filetype:{config_ext}'
      - 'site:{domain} "DB_PASSWORD"'

  backups:
    mode: medium
    dorks:
      - 'site:{domain} filetype:{backup_ext}'
      - 'site:{domain} inurl:backup'
      - 'site:{domain} intitle:"index of" "backup"'
      - 'site:{domain} inurl:{file}'

  databases:
    mode: medium
    dorks:
      - 'site:{domain} filetype:sql'
      - 'site:{domain} filetype:sql "INSERT INTO"'
      - 'site:{domain} "phpMyAdmin" inurl:phpmyadmin'
      - 'site:{domain} inurl:adminer.php'

  # --------------------------------------------------------------------------
  # PANNELLI & DIAGNOSTICA (medium)
  # --------------------------------------------------------------------------
  admin_panels:
    mode: medium
    dorks:
      - 'site:{domain} inurl:admin'
      - 'site:{domain} inurl:login'
      - 'site:{domain} intitle:"login" inurl:admin'
      - 'site:{domain} inurl:phpmyadmin'

  diagnostics:
    mode: medium
    dorks:
      - 'site:{domain} inurl:phpinfo.php'
      - 'site:{domain} ext:php intitle:phpinfo "published by the PHP Group"'
      - 'site:{domain} inurl:server-status'
      - 'site:{domain} inurl:info.php'

  errors_leaks:
    mode: medium
    dorks:
      - 'site:{domain} "Warning: mysql_"'
      - 'site:{domain} "Fatal error" filetype:log'
      - 'site:{domain} "stack trace" ext:log'
      - 'site:{domain} inurl:error_log'

  # --------------------------------------------------------------------------
  # PII / DATI PERSONALI (medium)
  # --------------------------------------------------------------------------
  pii:
    mode: medium
    dorks:
      - 'site:{domain} filetype:{extension} "email"'
      - 'site:{domain} filetype:csv "password"'
      - 'site:{domain} filetype:xlsx "codice fiscale"'
      - 'site:{domain} "curriculum" filetype:pdf'

  # --------------------------------------------------------------------------
  # PARAMETRI INIETTABILI — rumorose e aggressive (aggressive)
  #   NB: individuano URL con parametri; la verifica attiva (SQLi/XSS) va fatta
  #   consapevolmente con gli appositi moduli, non da questa discovery.
  # --------------------------------------------------------------------------
  sqli:
    mode: aggressive
    dorks:
      - 'site:{domain} inurl:{param}='
      - 'site:{domain} inurl:".php?{param}="'
      - 'site:{domain} inurl:"index.php?{param}="'

  lfi_rfi:
    mode: aggressive
    dorks:
      - 'site:{domain} inurl:"?file={param}"'
      - 'site:{domain} inurl:"?page={param}"'
      - 'site:{domain} inurl:"?path="'

  open_redirect:
    mode: aggressive
    dorks:
      - 'site:{domain} inurl:"redirect="'
      - 'site:{domain} inurl:"url="'
      - 'site:{domain} inurl:"return="'
      - 'site:{domain} inurl:"next="'
