# Author: script by xPloits3c / DorkEye
# Use permitted only on assets you own or with explicit authorization.

variables:
  domain:
    - example.com # replace with your own domain

  param:
    - cv
    - secret
    - data

  extension:
    - pdf
    - xls
    - xlsx
    - doc

templates:

  example_search:
    mode: soft
    dorks:
      - 'site:{domain} inurl:{param}'
      - 'filetype:{extension} site:{domain}'

  documents:
    mode: soft
    dorks:
      - 'site:{domain} filetype:{extension}'
      - 'filetype:pdf site:{domain}'
      
  directories:
    mode: soft
    dorks:
      - '"index of" site:{domain}'
      - '"parent directory" site:{domain}'
    
  sqli:
    mode: aggressive
    dorks:
      - 'site:{domain} inurl:.php?{param}='
      
  sensitive:
    mode: medium
    dorks:
      - '"index of"'
