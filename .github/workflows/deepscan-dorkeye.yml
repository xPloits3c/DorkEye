name: 🛡️ DorkEye Ultimate Deep Scan & Anti-Exploit

on:
  workflow_dispatch: # Esecuzione manuale
  schedule:
    - cron: "0 0 * * 1" # Ogni lunedì a mezzanotte

jobs:
  deep-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Advanced Audit Tools
        run: |
          pip install anthropic bandit pip-audit safety semgrep jq --quiet
          # Strumenti installati: 
          # - Semgrep: Pattern matching per SQLi/XSS
          # - Bandit: Sicurezza statica Python
          # - Pip-audit: Vulnerabilità dipendenze
          # - Anthropic: Motore IA Claude 3.5

      - name: 🔍 Security Scans (Bandit & Semgrep)
        run: |
          # Scan Bandit
          bandit -r . -f json -o bandit_report.json || true
          
          # Scan Semgrep (Configurazione focalizzata su vulnerabilità web/python)
          semgrep scan --config auto --json -o semgrep_report.json || true

      - name: 📦 Dependency Audit
        run: |
          pip-audit --format json --output pip_audit.json || true

      - name: 🤖 AI Core Advanced Security Analysis
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat << 'EOF' > deep_scan_engine.py
          import os, json, subprocess
          from anthropic import Anthropic

          def load_report(filename):
              if os.path.exists(filename):
                  try:
                      with open(filename, "r") as f:
                          return f.read()[:7000] # Limite per gestire il contesto
                  except: return "Error reading file"
              return "N/A"

          def run_audit():
              client = Anthropic(api_key=os.getenv("ANTHROPIC_API_KEY"))
              
              bandit_data = load_report("bandit_report.json")
              semgrep_data = load_report("semgrep_report.json")
              pip_data = load_report("pip_audit.json")
              
              prompt = f"""
              Esegui un Audit di Sicurezza Avanzato su DorkEye.
              
              CONTEXT:
              - DorkEye: Tool OSINT/Dorking modulare (YAML).
              - Supporto Termux/Mobile e resistenza ai ban (Silent Fingerprinting).
              - ddgs deve restare < 5.0.0.

              DATI SCANNER:
              - SEMGREP (Pattern SQLi/XSS): {semgrep_data}
              - BANDIT (Logic flaws): {bandit_data}
              - PIP-AUDIT (Supply chain): {pip_data}

              FOCUS VULNERABILITÀ CRITICHE:
              1. **Anti-SQLi**: Esamina 'Tools/dorkeye_analyze.py'. Controlla che i payload non siano concatenati come stringhe e che il 'confidence scoring' sia solido.
              2. **Anti-XSS**: Esamina 'Tools/dorkeye_report.py'. Verifica l'escaping HTML sui dati provenienti dal web prima della scrittura del report.
              3. **YAML Security**: Verifica l'uso esclusivo di SafeLoader in 'config/' e nel core per prevenire RCE.
              4. **Malware/Backdoor**: Cerca comportamenti sospetti (esecuzioni remote, esfiltrazione dati non dichiarata).

              TASK:
              - Identifica i punti di contatto tra input esterno (URL/Dork) e funzioni sensibili.
              - Per ogni vulnerabilità CRITICAL/HIGH, fornisci il FIX esatto in formato codice.
              """

              response = client.messages.create(
                  model="claude-3-5-sonnet-20240620",
                  max_tokens=4000,
                  system="Sei l'Ufficiale di Sicurezza Senior di DorkEye. Analisi tecnica rigorosa, zero chiacchiere.",
                  messages=[{"role": "user", "content": prompt}]
              )
              return response.content[0].text

          def create_issue(report):
              with open("report.md", "w") as f: f.write(report)
              # Crea issue usando la CLI di GitHub
              subprocess.run("gh issue create --title '🦅 DorkEye Security Audit Report' --label 'security, bug' --body-file report.md", shell=True)

          if __name__ == "__main__":
              print("🚀 Avvio Deep Scan combinato...")
              report = run_audit()
              create_issue(report)
              print("✅ Audit completato. Issue creata.")
          EOF
          python deep_scan_engine.py
