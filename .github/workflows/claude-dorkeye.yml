# ─────────────────────────────────────────────────────────────────────────────
# 🦅 DorkEye — Claude Code Agent
# ─────────────────────────────────────────────────────────────────────────────

name: 🦅 DorkEye AI Agent

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]
  schedule:
    # Monday 08:17 UTC (09:17 CET / 10:17 CEST). Off the :00 mark to avoid
    # GitHub's scheduler congestion and skipped runs.
    - cron: "17 8 * * 1"
  workflow_dispatch:


jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # JOB 1: PR analysis
  # ───────────────────────────────────────────────────────────────────────────
  pr-review:
    name: 🔍 PR Review & Security
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: dorkeye-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          claude_args: |
            --max-turns 10
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Glob,Grep"
            --append-system-prompt "You are the Senior Security Auditor for DorkEye. Focus: XSS in reports, SQLi logic, and Python 3.8 compatibility. ddgs MUST stay on v4.x (< 5.0.0). Tool modules live in Tools/ and are invoked through the DorkEye dispatcher. Be brutal about bugs but concise."
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            1. Read the diff with `gh pr diff` and open every touched file.
            2. Review only what the PR changes, plus code it directly affects.
               Pay extra attention if it touches dorkeye.py, Tools/dorkeye_analyze.py,
               dorkeye_report.py, xss.py or sqli.py (xss.py imports shared classes
               from sqli.py: changes there can break both).
            3. Flag any syntax or stdlib usage not available in Python 3.8
               (walrus in comprehensions is fine; match/case, `X | Y` types,
               built-in generics like list[str] at runtime are not).
            4. Flag any change that would bump ddgs to >= 5.0.0.
            Use inline comments for specific bugs, then post ONE summary table
            of findings with severity via `gh pr comment`. If nothing is wrong,
            say so in one line.

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 2: Interactive assistant (@claude)
  # Only repo owner/collaborators can trigger it (public repo protection).
  # Claude works on a branch and opens a PR: you review and merge.
  # ───────────────────────────────────────────────────────────────────────────
  interactive:
    name: 💬 Claude Assistant
    if: |
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'issues' && contains(github.event.issue.body, '@claude'))
      ) &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
        github.event.comment.author_association || github.event.issue.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: dorkeye-chat-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 15
            --append-system-prompt "You are Claude, integrated into DorkEye (by xPloits3c). You know the Python/YAML architecture. Constraints: Python 3.8 compatibility, ddgs < 5.0.0, tool modules in Tools/ are run via the DorkEye dispatcher, keep the repo root clean (iSH files go in iOS/). Never push to master: work on a branch and open a PR. Answer in a technical, solution-oriented way."

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 3: Weekly audit
  # ───────────────────────────────────────────────────────────────────────────
  weekly-audit:
    name: 🔐 Weekly Security Audit
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: dorkeye-weekly-audit
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          # Audit tooling runs on 3.12; the project itself targets 3.8.
          python-version: "3.12"

      - name: Setup & Pre-Audit
        run: |
          # jq is preinstalled on ubuntu-latest: do NOT install it via pip
          pip install --quiet bandit pip-audit

          # Bandit: medium+ severity only, compact summary for Claude's context
          bandit -r . -x ./.git,./tests,./dorkeye_env -f json -o bandit.json -ll || true
          [ -s bandit.json ] || echo '{"results":[]}' > bandit.json
          jq '[.results[] | {file: .filename, line: .line_number, issue: .issue_text, severity: .issue_severity}]' \
            bandit.json > bandit_summary.json

          # pip-audit against the project's requirements, not the runner env
          if [ -f requirements.txt ]; then
            pip-audit -r requirements.txt --format json --output pip.json || true
          fi
          [ -s pip.json ] || echo '{"dependencies":[]}' > pip.json
          jq '[.dependencies[] | select((.vulns | length) > 0) | {name: .name, version: .version, vulns: [.vulns[].id]}]' \
            pip.json > pip_summary.json

      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 60
            --allowedTools "Read,Glob,Grep,Bash(gh issue create:*),Bash(gh issue list:*),Bash(gh issue view:*),Bash(gh issue comment:*)"
            --append-system-prompt "Run the DorkEye weekly audit. Raw data is in bandit_summary.json and pip_summary.json. Keep ddgs < 5.0.0: never recommend upgrading it to 5.x, even if pip-audit flags it; suggest a mitigation instead. Python 3.8 compatibility is required."
          prompt: |
            REPO: ${{ github.repository }}

            1. Check for confidence gaps in Tools/dorkeye_analyze.py.
            2. Verify XSS sanitization in dorkeye_report.py.
            3. Review xss.py and sqli.py for logic bugs.
            4. Review bandit_summary.json and pip_summary.json; discard false positives.

            Then:
            - Run `gh issue list --label weekly-audit --state open` first.
            - If an open audit issue already covers a finding, add a comment
              to it with `gh issue comment` instead of opening a duplicate.
            - If there are NEW, real findings, open ONE issue titled
              "🔐 Weekly Audit — <YYYY-MM-DD>" with label `weekly-audit`,
              containing a table: file, line, severity, description, fix.
            - If there is nothing new, do not open any issue.
