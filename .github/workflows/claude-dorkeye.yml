# ─────────────────────────────────────────────────────────────────────────────
# 🦅 DorkEye — Optimized Claude Code Agent Workflow
# ─────────────────────────────────────────────────────────────────────────────

name: 🦅 DorkEye AI Agent

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [assigned]
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

concurrency:
  group: dorkeye-ai-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # JOB 1: Analisi PR (Ottimizzato per velocità e costi)
  pr-review:
    name: 🔍 PR Review & Security
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          # Ridotto a 10 turns per evitare loop infiniti e costi inutili su PR semplici
          claude_args: |
            --max-turns 10
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Read,GlobTool"
            --append-system-prompt "Sei il Senior Security Auditor di DorkEye. Focus: XSS nei report, SQLi logic, e compatibilità Python 3.8. DDGS DEVE rimanere v4.x. Sii brutale sui bug ma conciso."
          prompt: |
            Analizza PR #${{ github.event.pull_request.number }} nel repository ${{ github.repository }}.
            Verifica la sicurezza di dorkeye.py e Tools/dorkeye_analyze.py. 
            Posta una tabella riepilogativa con la severity dei finding.

  # JOB 2: Assistente (Semplificato)
  interactive:
    name: 💬 Claude Assistant
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --max-turns 8
            --append-system-prompt "Sei Claude, integrato in DorkEye (by xPloits3c). Conosci l'architettura Python/YAML. Rispondi in modo tecnico e risolutivo."

  # JOB 3: Audit Settimanale (Rafforzato contro i crash)
  weekly-audit:
    name: 🔐 Weekly Security Audit
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup & Pre-Audit
        id: pre_audit
        run: |
          pip install bandit pip-audit jq --quiet
          # Generiamo versioni "leggere" dei report per non intasare il contesto di Claude
          bandit -r . -f json -o bandit.json -ll || true
          jq '[.results[] | {file: .filename, line: .line_number, issue: .issue_text, severity: .issue_severity}]' bandit.json > bandit_summary.json
          
          pip-audit --format json --output pip.json || true
          jq '[.dependencies[] | select(.vulns | length > 0) | {name: .name, version: .version, vulns: [.vulns[].id]}]' pip.json > pip_summary.json

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Aumentati i turni perché l'audit richiede più passaggi di lettura
          claude_args: |
            --max-turns 25
            --allowedTools "Read,GlobTool,GrepTool,Bash(gh issue create:*),Bash(gh issue list:*)"
            --append-system-prompt "Esegui l'audit di DorkEye. Hai a disposizione bandit_summary.json e pip_summary.json per i dati grezzi. Crea una issue solo se trovi nuovi problemi reali. Mantieni ddgs < 5.0.0."
          prompt: |
            Analizza l'intero repository. 
            1. Controlla gap di confidenza in dorkeye_analyze.py.
            2. Verifica sanitizzazione XSS in dorkeye_report.py.
            3. Esamina bandit_summary.json e pip_summary.json.
            Crea un report dettagliato come GitHub Issue.
