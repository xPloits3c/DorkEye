# ─────────────────────────────────────────────────────────────────────────────
# 🦅 DorkEye — Claude Code Agent
# ─────────────────────────────────────────────────────────────────────────────

name: 🦅 DorkEye AI Agent

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]
  schedule:
    # Monday 08:17 UTC (09:17 CET / 10:17 CEST). Off the :00 mark to avoid
    # GitHub's scheduler congestion and skipped runs.
    - cron: "17 8 * * 1"
  workflow_dispatch:


jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # JOB 1: PR analysis
  # ───────────────────────────────────────────────────────────────────────────
  pr-review:
    name: 🔍 PR Review & Security
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: dorkeye-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          claude_args: |
            --max-turns 10
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Glob,Grep"
            --append-system-prompt "You are the Senior Security Auditor for DorkEye. Focus: XSS in reports, SQLi logic, and Python 3.7 compatibility (minimum runtime). ddgs MUST stay on >= 6.0.0 (older 4.x/5.x APIs return no results); it is installed only on Python >= 3.9, while 3.7/3.8 use the built-in Devices/iOS/ddg_lite.py. Tool modules live in Tools/ and are invoked through the DorkEye dispatcher. Be brutal about bugs but concise."
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            1. Read the diff with `gh pr diff` and open every touched file.
            2. Review only what the PR changes, plus code it directly affects.
               Pay extra attention if it touches dorkeye.py, Tools/dorkeye_analyze.py,
               Tools/dorkeye_agents.py, Tools/report.py or Tools/osint.py (report
               builders: every interpolated value must be escaped),
               Tools/xss.py or Tools/sqli.py (xss.py imports shared classes
               from sqli.py: changes there can break both).
            3. Flag any syntax or stdlib usage not available in Python 3.7:
               walrus `:=`, positional-only `/` params, f-string `=` (3.8);
               built-in generics like list[str] or dict | dict at runtime,
               str.removeprefix, functools.cache, zoneinfo (3.9); match/case,
               `X | Y` types (3.10); anything newer. Annotations are fine
               under `from __future__ import annotations`.
            4. Flag any change that would lower ddgs below 6.0.0.
            Use inline comments for specific bugs, then post ONE summary table
            of findings with severity via `gh pr comment`. If nothing is wrong,
            say so in one line.

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 2: Interactive assistant (@claude)
  # Only repo owner/collaborators can trigger it (public repo protection).
  # Claude works on a branch and opens a PR: you review and merge.
  # ───────────────────────────────────────────────────────────────────────────
  interactive:
    name: 💬 Claude Assistant
    if: |
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'issues' && contains(github.event.issue.body, '@claude'))
      ) &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
        github.event.comment.author_association || github.event.issue.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: dorkeye-chat-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 15
            --append-system-prompt "You are Claude, integrated into DorkEye (by xPloits3c). You know the Python/YAML architecture. Constraints: Python >= 3.7 (ddgs only on >= 3.9; 3.7/3.8 use Devices/iOS/ddg_lite.py), ddgs >= 6.0.0, tool modules in Tools/ are run via the DorkEye dispatcher, keep the repo root clean (iSH files go in iOS/). Never push to master: work on a branch and open a PR. Answer in a technical, solution-oriented way."

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 3: Weekly audit
  # ───────────────────────────────────────────────────────────────────────────
  weekly-audit:
    name: 🔐 Weekly Security Audit
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: dorkeye-weekly-audit
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          # Audit tooling runs on 3.12; the project itself supports Python >= 3.7.
          python-version: "3.12"

      - name: Setup & Pre-Audit
        run: |
          # jq is preinstalled on ubuntu-latest: do NOT install it via pip
          pip install --quiet bandit pip-audit

          # Bandit: medium+ severity only, compact summary for Claude's context
          bandit -r . -x ./.git,./tests,./dorkeye_env -f json -o bandit.json -ll || true
          [ -s bandit.json ] || echo '{"results":[]}' > bandit.json
          jq '[.results[] | {file: .filename, line: .line_number, issue: .issue_text, severity: .issue_severity}]' \
            bandit.json > bandit_summary.json

          # pip-audit against the project's requirements, not the runner env
          if [ -f requirements.txt ]; then
            pip-audit -r requirements.txt --format json --output pip.json || true
          fi
          [ -s pip.json ] || echo '{"dependencies":[]}' > pip.json
          jq '[.dependencies[] | select((.vulns | length) > 0) | {name: .name, version: .version, vulns: [.vulns[].id]}]' \
            pip.json > pip_summary.json

      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 60
            --allowedTools "Read,Glob,Grep,Bash(gh issue create:*),Bash(gh issue list:*),Bash(gh issue view:*),Bash(gh issue comment:*)"
            --append-system-prompt "Run the DorkEye weekly audit. Raw data is in bandit_summary.json and pip_summary.json. Keep ddgs >= 6.0.0: never recommend downgrading it to 4.x/5.x (older APIs return no results); if pip-audit flags it, suggest a 6.x upgrade or a mitigation. Python >= 3.7 is the minimum runtime (ddgs only on >= 3.9, ddg_lite fallback below); fixes must not need Python 3.8+ syntax or stdlib."
          prompt: |
            REPO: ${{ github.repository }}

            1. Confidence: every SECRET_RULES description in
               Tools/dorkeye_patterns.py must have an entry in SECRET_CONFIDENCE
               (unlisted rules silently fall back to MEDIUM). Flag missing or
               clearly wrong levels.
            2. Output escaping in EVERY HTML/Markdown report builder. Every
               interpolated value must go through the shared helpers in
               Tools/dorkeye_patterns.py (esc, safe_href, html_link, md_cell,
               md_code, md_text) and HTML reports must include REPORT_CSP_META:
               - Tools/dorkeye_analyze.py: _report_html, _report_md
               - Tools/dorkeye_agents.py: ReportAgent _html and _markdown,
                 generate_html_section
               - Tools/report.py (shared report engine, own html.escape and
                 _safe_href): build_dork_html incl. the showInfo() popup JS,
                 write_report (tab labels + iframe srcdoc), render_dbscan_html
               - Tools/osint.py: render_html (_h helper; graph data embedded as
                 JSON in a script tag, rendered with textContent only)
               - Tools/dorkeye_web.py: the JS esc() helper and every innerHTML /
                 template-literal sink (esc() must also escape quotes when used
                 inside attributes)
            3. Review Tools/xss.py and Tools/sqli.py for logic bugs.
            4. Review bandit_summary.json and pip_summary.json; discard false positives.
               Already accepted, do not report again: requests verify=False in
               the scanners (they probe self-signed hosts on purpose); the
               "0.0.0.0" string in db_portscan.py (blocklist entry, not a bind);
               MD5 in dorkeye.py (usedforsecurity=False, not security-relevant).

            Then:
            - Run `gh issue list --label weekly-audit --state open` first.
            - If an open audit issue already covers a finding, add a comment
              to it with `gh issue comment` instead of opening a duplicate.
            - If there are NEW, real findings, open ONE issue titled
              "🔐 Weekly Audit — <YYYY-MM-DD>" with label `weekly-audit`,
              containing a table: file, line, severity, description, fix.
            - If there is nothing new, do not open any issue.
