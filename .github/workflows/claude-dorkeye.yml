# ─────────────────────────────────────────────────────────────────────────────
# 🦅 DorkEye — Claude Code Agent
# ─────────────────────────────────────────────────────────────────────────────

name: 🦅 DorkEye AI Agent

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:


jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # JOB 1: PR analysis
  # ───────────────────────────────────────────────────────────────────────────
  pr-review:
    name: 🔍 PR Review & Security
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: dorkeye-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          claude_args: |
            --max-turns 10
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Glob,Grep"
            --append-system-prompt "You are the Senior Security Auditor for DorkEye. Focus: XSS in reports, SQLi logic, and Python 3.8 compatibility. DDGS MUST stay on v4.x. Be brutal about bugs but concise."
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Analyze this PR using `gh pr diff` and read the touched files.
            Check the security of dorkeye.py and Tools/dorkeye_analyze.py.
            Use inline comments for specific bugs, then post a summary table
            of findings with their severity via `gh pr comment`.
            
  # ───────────────────────────────────────────────────────────────────────────
  # JOB 2: Interactive assistant (@claude)
  # ───────────────────────────────────────────────────────────────────────────
  interactive:
    name: 💬 Claude Assistant
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: dorkeye-chat-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --max-turns 8
            --append-system-prompt "You are Claude, integrated into DorkEye (by xPloits3c). You know the Python/YAML architecture. Answer in a technical, solution-oriented way."

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 3: Weekly audit
  # ───────────────────────────────────────────────────────────────────────────
  weekly-audit:
    name: 🔐 Weekly Security Audit
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: dorkeye-weekly-audit
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup & Pre-Audit
        run: |
          # jq is preinstalled on ubuntu-latest: do NOT install it via pip
          # (the pip "jq" package is the Python bindings, not the CLI)
          pip install --quiet bandit pip-audit

          # Bandit: lightweight report so we don't flood Claude's context
          bandit -r . -x ./.git,./tests -f json -o bandit.json -ll || true
          [ -s bandit.json ] || echo '{"results":[]}' > bandit.json
          jq '[.results[] | {file: .filename, line: .line_number, issue: .issue_text, severity: .issue_severity}]' \
            bandit.json > bandit_summary.json

          # pip-audit: point it at the requirements file, otherwise it audits
          # the runner environment instead of the project's dependencies
          if [ -f requirements.txt ]; then
            pip-audit -r requirements.txt --format json --output pip.json || true
          fi
          [ -s pip.json ] || echo '{"dependencies":[]}' > pip.json
          jq '[.dependencies[] | select((.vulns | length) > 0) | {name: .name, version: .version, vulns: [.vulns[].id]}]' \
            pip.json > pip_summary.json

      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --max-turns 25
            --allowedTools "Read,Glob,Grep,Bash(gh issue create:*),Bash(gh issue list:*)"
            --append-system-prompt "Run the DorkEye audit. Raw data is available in bandit_summary.json and pip_summary.json. Before creating an issue, check with gh issue list that it doesn't already exist. Only create an issue if you find new, real problems. Keep ddgs < 5.0.0."
          prompt: |
            REPO: ${{ github.repository }}

            Analyze the whole repository.
            1. Check for confidence gaps in dorkeye_analyze.py.
            2. Verify XSS sanitization in dorkeye_report.py.
            3. Review bandit_summary.json and pip_summary.json.
            Create a detailed report as a GitHub Issue.
