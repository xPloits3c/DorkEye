[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dorkeye"
version = "4.9.2"
description = "Advanced Google Dorking with Google Dorks Generator, SQLi analysis, WAF detection and extract metadata."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "xPloits3c", email = "whitehat.report@onionmail.org" }
]
keywords = ["osint", "dorking", "google-dork", "security", "recon", "sqli", "pentest", "dorks-queries"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Internet :: WWW/HTTP",
]
requires-python = ">=3.8"
dependencies = [
    "requests>=2.32.3,<3.0.0",
    "urllib3>=2.2.0,<3.0.0",
    "PyYAML>=6.0.2,<7.0.0",
    "rich>=13.7.0,<14.0.0",
    "ddgs>=6.0.0",
    "colorama>=0.4.6",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
]

[project.optional-dependencies]
llm = [
    "llama-cpp-python>=0.2.0",
]
screenshots = [
    "playwright>=1.40.0",
]
all = [
    "llama-cpp-python>=0.2.0",
    "playwright>=1.40.0",
]

[project.scripts]
dorkeye = "dorkeye:main"

[project.urls]
Homepage = "https://github.com/xPloits3c/DorkEye"
Repository = "https://github.com/xPloits3c/DorkEye"
"Bug Tracker" = "https://github.com/xPloits3c/DorkEye/issues"
Changelog = "https://github.com/xPloits3c/DorkEye/blob/main/CHANGELOG.md"

[tool.setuptools]
py-modules = ["dorkeye"]

[tool.setuptools.package-data]
dorkeye = ["templates/*.html", "wordlists/*.txt"]
